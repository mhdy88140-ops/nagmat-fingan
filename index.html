<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>نغمة فنجان</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f7f3ee;
  color:#2b211b;
}

header{
  background:#2b211b;
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{
  margin:0 0 7px;
  font-size:30px;
}

header p{
  margin:0;
  color:#ddd;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.hero{
  background:#d9c0a5;
  border-radius:20px;
  padding:30px 20px;
  text-align:center;
  margin-bottom:25px;
}

.hero h2{
  margin-top:0;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:18px;
}

.product{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 3px 12px #0002;
}

.product img{
  width:100%;
  height:190px;
  object-fit:cover;
}

.product-info{
  padding:15px;
}

.product-info h3{
  margin:0 0 8px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.buy{
  display:block;
  background:#25D366;
  color:white;
  text-decoration:none;
  text-align:center;
  padding:11px;
  border-radius:10px;
  font-weight:bold;
}

.admin-button{
  display:block;
  width:160px;
  margin:30px auto 0;
  padding:10px;
  background:#2b211b;
  color:white;
  border:0;
  border-radius:10px;
}

#adminPanel{
  display:none;
  background:white;
  margin-top:25px;
  padding:20px;
  border-radius:18px;
  box-shadow:0 3px 15px #0002;
}

input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:10px;
}

.admin-product{
  border:1px solid #ddd;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

.admin-product button,
.add-button,
.logout{
  border:0;
  padding:10px 14px;
  border-radius:9px;
  margin:5px 2px;
  cursor:pointer;
}

.add-button{
  background:#2b211b;
  color:white;
  width:100%;
}

.logout{
  background:#c62828;
  color:white;
}

.delete{
  background:#c62828;
  color:white;
}

.save{
  background:#198754;
  color:white;
}

footer{
  margin-top:40px;
  background:#2b211b;
  color:white;
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <h1>☕ نغمة فنجان</h1>
  <p>كل ما تحتاجه للقهوة في مكان واحد</p>
</header>

<div class="container">

<section class="hero">
  <h2>أهلاً بكم في نغمة فنجان</h2>
  <p>قهوة، معدات، وأدوات القهوة إلى جميع أنحاء العراق</p>
</section>

<h2>منتجاتنا</h2>

<div id="products" class="products"></div>

<button class="admin-button" onclick="loginAdmin()">
  🔐 إدارة المتجر
</button>

<div id="adminPanel">

  <h2>لوحة إدارة نغمة فنجان</h2>

  <h3>إضافة منتج جديد</h3>

  <input id="newName" placeholder="اسم المنتج">

  <input id="newPrice" placeholder="السعر">

  <input id="newImage" placeholder="رابط صورة المنتج">

  <button class="add-button" onclick="addProduct()">
    ➕ إضافة المنتج
  </button>

  <h3>المنتجات الحالية</h3>

  <div id="adminProducts"></div>

  <button class="logout" onclick="logoutAdmin()">
    تسجيل خروج
  </button>

</div>

</div>

<footer>
  © 2026 نغمة فنجان
</footer>

<script>

const ADMIN_PASSWORD = "n123n123n";

let products = JSON.parse(localStorage.getItem("nagmatProducts")) || [

  {
    name:"قهوة مختصة",
    price:"15000",
    image:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085"
  },

  {
    name:"معدات قهوة",
    price:"25000",
    image:"https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd"
  }

];

function saveProducts(){

  localStorage.setItem(
    "nagmatProducts",
    JSON.stringify(products)
  );

}

function showProducts(){

  const box=document.getElementById("products");

  box.innerHTML="";

  products.forEach((p,index)=>{

    box.innerHTML += `

      <div class="product">

        <img src="${p.image}">

        <div class="product-info">

          <h3>${p.name}</h3>

          <div class="price">
            ${p.price} د.ع
          </div>

          <a class="buy"
             href="https://wa.me/964XXXXXXXXXX">
             🛒 طلب عبر واتساب
          </a>

        </div>

      </div>

    `;

  });

}

function loginAdmin(){

  const password=prompt("أدخل كلمة سر الإدارة:");

  if(password===ADMIN_PASSWORD){

    document.getElementById("adminPanel").style.display="block";

    showAdminProducts();

  }else{

    alert("❌ كلمة السر غير صحيحة");

  }

}

function showAdminProducts(){

  const box=document.getElementById("adminProducts");

  box.innerHTML="";

  products.forEach((p,index)=>{

    box.innerHTML += `

      <div class="admin-product">

        <input
          id="name${index}"
          value="${p.name}"
          placeholder="اسم المنتج">

        <input
          id="price${index}"
          value="${p.price}"
          placeholder="السعر">

        <input
          id="image${index}"
          value="${p.image}"
          placeholder="رابط الصورة">

        <button class="save"
          onclick="editProduct(${index})">
          💾 حفظ التعديل
        </button>

        <button class="delete"
          onclick="deleteProduct(${index})">
          🗑️ حذف
        </button>

      </div>

    `;

  });

}

function addProduct(){

  const name=document.getElementById("newName").value.trim();

  const price=document.getElementById("newPrice").value.trim();

  const image=document.getElementById("newImage").value.trim();

  if(!name || !price || !image){

    alert("اكتب اسم المنتج والسعر ورابط الصورة");

    return;

  }

  products.push({

    name:name,

    price:price,

    image:image

  });

  saveProducts();

  showProducts();

  showAdminProducts();

  document.getElementById("newName").value="";

  document.getElementById("newPrice").value="";

  document.getElementById("newImage").value="";

}

function editProduct(index){

  products[index].name=
    document.getElementById("name"+index).value;

  products[index].price=
    document.getElementById("price"+index).value;

  products[index].image=
    document.getElementById("image"+index).value;

  saveProducts();

  showProducts();

  alert("✅ تم حفظ التعديل");

}

function deleteProduct(index){

  if(confirm("متأكد تريد حذف المنتج؟")){

    products.splice(index,1);

    saveProducts();

    showProducts();

    showAdminProducts();

  }

}

function logoutAdmin(){

  document.getElementById("adminPanel").style.display="none";

}

showProducts();

</script>

</body>
</html>
